# Alembic configuration for the AI Harvest Agent database.
#
# The database URL is NOT set here — alembic/env.py reads DATABASE_URL from the
# environment (falling back to app settings / .env), so the same config works
# locally, in Docker, and on EC2.

[alembic]
script_location = alembic
prepend_sys_path = .
# Timezone-naive timestamps in migration filenames
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
