[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=Xvfb :99 -screen 0 1366x900x24 -nolisten tcp
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
; -localhost: listen on loopback only. x11vnc runs with -nopw, so 5900 must not be
; reachable from the Docker network; websockify (same container) connects via 127.0.0.1:5900,
; and nginx reaches noVNC through websockify on 6080 behind the /vnc/ admin auth_request.
command=x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -noxdamage
autorestart=true
priority=20
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
; 127.0.0.1 (not "localhost", which may resolve to ::1 first) - x11vnc -localhost
; is guaranteed to listen on IPv4 loopback.
command=websockify 6080 127.0.0.1:5900
autorestart=true
priority=30
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
; --proxy-headers: take the client IP from X-Forwarded-For, but only when the TCP peer is
; trusted: loopback or the Docker networks (172.16.0.0/12 covers compose's default bridge
; subnets) where the frontend nginx lives. Anyone else's X-Forwarded-For is ignored.
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "127.0.0.1,172.16.0.0/12"
directory=/app
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
