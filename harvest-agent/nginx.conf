# Serves the React build and reverse-proxies the FastAPI backend (service
# "api" in the repo-root docker-compose.yml) plus the noVNC/websockify live
# browser view, so the whole stack sits behind one origin.

# ── /jobs: SPA-page vs. JSON-API disambiguation ────────────────────────────
# /jobs and /jobs/{id} are BOTH React SPA routes AND live API endpoints
# (GET /jobs, /jobs/facets, /jobs/{id}). A hard browser load — address-bar
# reload, back/forward, deep link — must render the SPA, while the app's own
# fetch() calls must reach the API. The two are told apart by request headers:
# a navigation sends "Sec-Fetch-Mode: navigate" and "Accept: text/html…",
# whereas fetch() (api.js sets only Content-Type) sends "Sec-Fetch-Mode: cors"
# and "Accept: */*". $jobs_is_navigation is 1 for a navigation (→ index.html)
# and 0 for an API fetch (→ proxy). The '#' just separates the two headers so a
# value boundary can't accidentally spell "navigate"/"text/html".
map "$http_sec_fetch_mode#$http_accept" $jobs_is_navigation {
    default       0;
    "~navigate"   1;   # modern browsers: top-level navigation
    "~text/html"  1;   # fallback for clients that omit Sec-Fetch-Mode
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Live browser view (noVNC over websockify) ──────────────────────────
    location /vnc/ {
        proxy_pass http://api:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── Jobs: SPA page AND JSON API share the same path ────────────────────
    # See the $jobs_is_navigation map above. A browser navigation to /jobs or
    # /jobs/{id} (reload / back / deep link) is rewritten to the SPA; the app's
    # fetch() calls for GET /jobs, /jobs/facets and /jobs/{id} fall through to
    # the API proxy. This is why "jobs" is NOT in the generic API regex below —
    # unlike /outreach, bare /jobs is a real API endpoint so the trailing-slash
    # trick can't disambiguate it.
    location ~ ^/jobs(/|$) {
        if ($jobs_is_navigation) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 660s;
    }

    # ── Backend API routes (mounted at root in app/main.py) ────────────────
    # NOTE: "outreach/" (with the trailing slash) is deliberate — the backend
    # only defines sub-paths (/outreach/history, /outreach/send-email,
    # /outreach/mailjet-events, …), while bare /outreach is a React SPA page.
    # Matching "outreach/" proxies the API sub-paths but lets a hard load of
    # /outreach fall through to index.html below (otherwise FastAPI returns
    # {"detail":"Not Found"} on reload/back-button).
    location ~ ^/(auth|harvest-config|run-harvest-agent|harvest-status|run-history|active-run|lead-intelligence|linkedin-setup-session|naukri-setup-session|health|run-linkedin-agent|linkedin-results|run-linkedin-feed-agent|linkedin-feed-results|run-naukri-agent|naukri-results|run-dice-agent|dice-results|run-prospect-intelligence|prospect-results|run-recruiter-discovery|outreach/|download) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 660s;   # setup-session / synchronous harvest calls can run for several minutes
    }

    # ── Hashed build assets (immutable) ────────────────────────────────────
    # CRA content-hashes every file under /static/ (main.[hash].js, etc.), so a
    # given URL's bytes never change — cache them for a year. This is what lets
    # us keep index.html always-fresh below without re-downloading the app.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── React app (client-side routing fallback) ───────────────────────────
    # index.html names the current bundle hashes, so it must never be served
    # stale — "no-cache" lets the browser keep a copy but revalidate (ETag/304)
    # on every load. Without this, a browser that cached an old index.html keeps
    # loading old JS after a redeploy (works in incognito, breaks in the normal
    # profile). Applies to the SPA fallback, which serves /index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
