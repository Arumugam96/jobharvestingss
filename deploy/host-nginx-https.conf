# Host-level HTTPS front for the Job Harvest stack (EC2 instance, NOT a container)
# ============================================================================
#
# What this is
#   The docker-compose stack serves plain HTTP on host port 8080 (the
#   "frontend" nginx container). Public HTTPS on 443 is terminated by a
#   separate nginx running directly on the host, which proxies to :8080.
#   That outer hop MUST forward the WebSocket upgrade headers and use a long
#   idle timeout on /vnc/, otherwise the Live Browser (noVNC) shows
#   "Disconnected" over https:// while REST calls keep working:
#     - without "Upgrade"/"Connection: upgrade" the WebSocket handshake fails;
#     - with nginx's default 60s proxy_read_timeout a quiet VNC session is cut.
#
# Where to put it (on the EC2 host)
#   1. Find what owns port 443:   sudo ss -ltnp | grep ':443'
#      If it's nginx, find the file serving your domain:
#                                 sudo nginx -T | grep -n server_name
#   2a. 443 ALREADY serves your domain (the usual case): merge only the `map`,
#      the `location /vnc/ { ... }` and the `location ~ ^/run-...-agent` blocks
#      below into that existing server{}
#      — keep only ONE `map $http_upgrade $connection_upgrade` across all included
#      files, nginx refuses a duplicate.
#   2b. Fresh host, no certificate yet: get the cert FIRST — `listen 443 ssl`
#      without ssl_certificate fails `nginx -t`, and certbot runs that same test:
#                                 sudo certbot certonly --nginx -d <domain>
#      Then copy this file to /etc/nginx/conf.d/harvest-https.conf, replace every
#      <domain> with your real host name, and uncomment the two ssl_certificate
#      lines (certbot's renewal timer keeps those files current).
#   3. Apply:                     sudo nginx -t && sudo systemctl reload nginx
#
# Keep API_BIND_IP=127.0.0.1 (docker-compose default) and never open 6080/8000
# in the firewall: websockify on 6080 has no password, and reaching it directly
# skips the /vnc/ login check in the container nginx.
#
# Check (expect "HTTP/1.1 101 Switching Protocols"; with the in-repo nginx's
# auth_request on /vnc/, the same request without an ha_session cookie gets 401):
#   curl -i -N -H "Connection: Upgrade" -H "Upgrade: websocket" \
#     -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: SGVsbG8sIHdvcmxkIQ==" \
#     -H "Cookie: ha_session=<your session cookie>" https://<domain>/vnc/

# Valid at http level (conf.d files are included inside http{}), never in server{}.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name <domain>;

    # ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;   # managed by certbot
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;     # managed by certbot

    # Live Browser WebSocket (noVNC → websockify inside the api container).
    location /vnc/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Synchronous single-source harvests (Source Runs tabs): POST
    # /run-naukri-agent, /run-linkedin-agent, /run-dice-agent hold the request
    # open for the whole run (Naukri: 40-90 min) — match the container nginx's
    # 2h, or this hop answers 504 while the harvest keeps running. Regex
    # locations beat the `location /` prefix below.
    location ~ ^/run-(naukri|linkedin|dice)-agent/?$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    # Everything else: SPA + API (setup-session / synchronous harvest calls can
    # run for several minutes, matching the container nginx's 660s).
    # X-Forwarded-For carries the real client IP through both nginx hops to the
    # API (uvicorn --proxy-headers); without it every user looks like the
    # Docker gateway to the rate limiter.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 660s;
    }
}

# HTTP → HTTPS redirect. Drop this block if the existing host site file already
# has one (certbot --nginx usually adds it), or if something other than this
# nginx owns host port 80.
server {
    listen 80;
    server_name <domain>;
    return 301 https://$host$request_uri;
}
