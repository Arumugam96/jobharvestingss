version: "3.9"

# Full-stack deployment (backend + frontend + live browser view) — intended
# for the EC2 target. For backend-only local dev, ai-harvest-agent/docker-compose.yml
# still works standalone.
#
# No Postgres/Redis/Celery here — the app doesn't use them. The only DB-backed
# route (app/routes/harvest.py) is a legacy CRUD API the frontend never calls,
# and harvests run as in-process asyncio background tasks (run_harvest_agent.py),
# not Celery jobs. Confirmed via grep: nothing in the codebase calls
# `.delay()`/`.apply_async()`.

services:
  api:
    build: ./ai-harvest-agent
    ports:
      - "8000:8000"
      - "6080:6080"   # noVNC/websockify — live view of the manual LinkedIn/Naukri login browser
    env_file: ./ai-harvest-agent/.env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    shm_size: "1gb"   # Chromium under Xvfb needs more than Docker's 64MB default /dev/shm

  frontend:
    build: ./harvest-agent
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
