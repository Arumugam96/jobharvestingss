# Full-stack deployment (backend + frontend + live browser view) — intended
# for the EC2 target.

services:
  api:
    build: ./ai-harvest-agent
    # No host port publishing — nginx (the "frontend" service) reaches this
    # container over the internal Docker network (http://api:8000, /vnc/ ->
    # http://api:6080) 
    expose:
      - "8000"
      - "6080"
    env_file: ./ai-harvest-agent/.env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    shm_size: "1gb"   # Chromium under Xvfb needs more than Docker's 64MB default /dev/shm

  frontend:
    build: ./harvest-agent
    ports:
      - "8080:80"   # host port 80 was already taken on this instance — app is served on 8080 instead
    depends_on:
      - api
    restart: unless-stopped
